# Manifiesto de DIAGNÓSTICO de propio_kf (v2). Solo ajuste: python bench.py correr --split ajuste --manifiesto diagnostico_v2.yaml --run diag_v2
# Derivado de secuencias.yaml (mismas secuencias, umbrales y correcciones); solo cambia la lista de trackers. NO usar con --split test.
datos_raiz: ../datos
detectores:
  yolo8x: {tipo: archivo, carpeta: detecciones/yolo8x}
  yolo8n: {tipo: archivo, carpeta: detecciones/yolo8n}
trackers:
- {nombre: propio_kf, etiqueta: propio_v1}
- nombre: propio_kf
  etiqueta: propio_A1_sin_clase
  config: {gate_clase: false}
- nombre: propio_kf
  etiqueta: propio_A2_debil05
  config: {gate_clase: false, match_iou_debil: 0.5}
- nombre: propio_kf
  etiqueta: propio_A3_fusion
  config: {gate_clase: false, match_iou_debil: 0.5, fuse_score: true}
- nombre: propio_kf
  etiqueta: propio_A4_tentativos
  config: {gate_clase: false, match_iou_debil: 0.5, fuse_score: true, confirmar_aparte: true}
- nombre: propio_kf
  etiqueta: propio_A5_sin_pad
  config: {gate_clase: false, box_pad: 0.0}
- bytetrack
- botsort
config_comun: {conf_entrada: 0.05, conf_high: 0.2, conf_low: 0.05, max_miss_sec: 1.0, min_hits: 4}
evaluacion:
  clases_evaluadas: [1]
  clases_ignoradas: [0]
  clases_distractoras: []
  umbral_area_ignorada: 0.5
  bins_ego_px: [0.5, 3.0]
  tramos_ego:
    cortes_px: [0.328, 1.241]
    etiquetas: [bajo, medio, alto]
  moving: {rel_mov: 0.3, rel_est: 0.1}
  protocolos: [todos, moviles, estaticos, e2e_moviles]
  bootstrap_n: 2000
barrido:
  singt_rho_min: 0.6
  grupos:
    cenital:
      pitch: [0, 5, 10, 15, 20, 25]
      altura: [15, 30, 50, 75, 100]
      hfov: 74
      punto: centro
    oblicua_baja:
      pitch: [25, 30, 35, 40, 45, 50, 55, 60, 65, 70]
      altura: [10, 15, 20, 25, 30]
      hfov: 74
      punto: base
    oblicua_alta:
      pitch: [25, 30, 35, 40, 45, 50, 55, 60, 65, 70]
      altura: [30, 45, 60, 80, 100]
      hfov: 74
      punto: base
