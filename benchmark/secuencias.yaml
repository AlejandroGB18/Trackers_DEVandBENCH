# Manifiesto del benchmark v1: UAVDT-MOT (D18). Plan: docs/plan-benchmark-v1.md · decisiones: DECISIONS.md
# Cambiar algo de aquí DESPUÉS de ver resultados de test invalida la comparación: anotarlo en DECISIONS.md.
#
# Rutas relativas a `datos_raiz`; en el laboratorio se sobrescribe con la variable de entorno BENCH_DATOS.
#   <datos_raiz>/UAVDT/{UAV-benchmark-M, UAV-benchmark-MOTD_v1.0, M_attr, gt_benchmark}
#   <datos_raiz>/detecciones/<detector>/{Mxxxx.txt, firma.json}
datos_raiz: ../datos

detectores:
  yolo8x:                                # D20: el de la v1 (laboratorio, GPU) — YOLOv8x, subconjunto curado de VisDrone
    tipo: archivo                        # generado con detectar_lab.py (imgsz 640, conf 0.05)
    carpeta: detecciones/yolo8x
  yolo8n:                                # solo para la prueba de la tubería en la Mac (no reportable)
    tipo: archivo
    carpeta: detecciones/yolo8n
# Las 5 clases del detector (car, truck, van, bus, freight car) entran todas: evaluación agnóstica de clase (D7).

trackers:                                # ranking = una entrada por tracker (D23)
  - propio_kf
  - bytetrack
  - botsort
  - {nombre: ucmc, etiqueta: ucmc_grupo_train, seleccion: runs/v1_ajuste/barrido/seleccion.csv, version: grupo_train}
  # fuera del ranking:
  - {nombre: ucmc, etiqueta: ucmc, en_ranking: false}                       # referencia: calibración automática
  - {nombre: ucmc, etiqueta: ucmc_oraculo_seq, seleccion: runs/v1_ajuste/barrido/seleccion.csv, version: oraculo_seq}

config_comun:                            # los 4 con defaults (D22); umbrales del detector: CONGELADO 1 (D21, D32)
  conf_entrada: 0.05                     # = conf_low (D21)
  conf_high: 0.20                        # mejor F1 de yolo8x en ajuste (0.808)
  conf_low: 0.05                         # precisión 0.78 en 0.05 ≥ 0.5 → piso de la caché
  max_miss_sec: 1.0
  min_hits: 4

evaluacion:
  clases_evaluadas: [1]                  # 1 = vehicle (car/truck/bus de UAVDT)
  clases_ignoradas: [0]                  # 0 = región ignorada de UAVDT (regla de área, D8)
  clases_distractoras: []
  umbral_area_ignorada: 0.5
  bins_ego_px: [0.5, 3.0]                # solo si no hay tramos_ego (legado VIGIA)
  tramos_ego: {cortes_px: [0.328, 1.241], etiquetas: [bajo, medio, alto]}   # CONGELADO 1 (D26, D32): P33/P67 en ajuste, px/frame a 960
  # CONGELADO 2 (D27): umbrales de moving calibrados con la revisión (calibracion.csv); por defecto los de D12
  # moving: {rel_mov: 0.30, rel_est: 0.10}
  protocolos: [todos, moviles, estaticos, e2e_moviles]
  bootstrap_n: 2000

barrido:                                 # cámara de UCMC por grupo de vuelo (D17, D24); hfov fijo (D17.1, A7)
  singt_rho_min: 0.6
  grupos:
    cenital:      {pitch: [0, 5, 10, 15, 20, 25], altura: [15, 30, 50, 75, 100], hfov: 74, punto: centro}
    oblicua_baja: {pitch: [25, 30, 35, 40, 45, 50, 55, 60, 65, 70], altura: [10, 15, 20, 25, 30], hfov: 74, punto: base}
    oblicua_alta: {pitch: [25, 30, 35, 40, 45, 50, 55, 60, 65, 70], altura: [30, 45, 60, 80, 100], hfov: 74, punto: base}

